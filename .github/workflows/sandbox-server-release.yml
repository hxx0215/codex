name: sandbox-server-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version to publish, without the v prefix (for example 0.1.0)."
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}::${{ inputs.version }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Validate release metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.metadata.outputs.release_tag }}
      source_sha: ${{ steps.metadata.outputs.source_sha }}
      version: ${{ steps.metadata.outputs.version }}

    steps:
      - name: Validate version and release destination
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version ${VERSION} must match X.Y.Z, for example 0.1.0." >&2
            exit 1
          fi

          release_tag="sandbox-server-v${VERSION}"
          if gh release view "${release_tag}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            echo "Release ${release_tag} already exists; publish changed bytes under a new version." >&2
            exit 1
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${release_tag}" > /dev/null 2>&1; then
            echo "Tag ${release_tag} already exists; publish changed bytes under a new version." >&2
            exit 1
          fi

          {
            echo "release_tag=${release_tag}"
            echo "source_sha=${SOURCE_SHA}"
            echo "version=${VERSION}"
          } >> "${GITHUB_OUTPUT}"

  build:
    name: Build ${{ matrix.target }}
    needs: metadata
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl

    steps:
      - name: Checkout source commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@786fff0690178f1234e4e1fe9b536e94f5433196 # v20

      - name: Inject sandbox server release version
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          version_lines="$(grep -c '^version = "0\.0\.0"$' codex-rs/Cargo.toml)"
          if [[ "${version_lines}" != "1" ]]; then
            echo "Expected exactly one workspace placeholder version, found ${version_lines}." >&2
            exit 1
          fi
          sed -i "s/^version = \"0\.0\.0\"$/version = \"${VERSION}\"/" codex-rs/Cargo.toml
          grep -F 'version = "'"${VERSION}"'"' codex-rs/Cargo.toml

      - name: Build static sandbox server bundle
        shell: bash
        run: nix build .#sandbox-server-static --print-build-logs

      - name: Stage and strip binaries
        env:
          SOURCE_SHA: ${{ needs.metadata.outputs.source_sha }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.metadata.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          package_name="codex-sandbox-server-${VERSION}-${TARGET}"
          package_root="${RUNNER_TEMP}/${package_name}"

          mkdir -p "${package_root}/bin"
          cp -L result/bin/codex-sandbox-server "${package_root}/bin/"
          cp -L result/bin/codex-linux-sandbox "${package_root}/bin/"
          cp LICENSE NOTICE "${package_root}/"
          printf '%s\n' "${VERSION}" > "${package_root}/VERSION"
          printf '%s\n' "${SOURCE_SHA}" > "${package_root}/SOURCE_COMMIT"

          chmod u+w \
            "${package_root}/bin/codex-sandbox-server" \
            "${package_root}/bin/codex-linux-sandbox"
          strip \
            "${package_root}/bin/codex-sandbox-server" \
            "${package_root}/bin/codex-linux-sandbox"
          chmod 0555 \
            "${package_root}/bin/codex-sandbox-server" \
            "${package_root}/bin/codex-linux-sandbox"

          ls -lh \
            "${package_root}/bin/codex-sandbox-server" \
            "${package_root}/bin/codex-linux-sandbox"

      - name: Verify staged binaries
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.metadata.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          package_name="codex-sandbox-server-${VERSION}-${TARGET}"
          package_root="${RUNNER_TEMP}/${package_name}"
          server="${package_root}/bin/codex-sandbox-server"
          helper="${package_root}/bin/codex-linux-sandbox"

          actual_version="$("${server}" --version)"
          echo "sandbox server version: ${actual_version}"
          if [[ "${actual_version}" != "codex-sandbox-server ${VERSION}" ]]; then
            echo "Expected codex-sandbox-server ${VERSION}, got ${actual_version}." >&2
            exit 1
          fi
          if ! "${helper}" --help > /dev/null; then
            echo "codex-linux-sandbox --help failed." >&2
            exit 1
          fi

          for binary in "${server}" "${helper}"; do
            description="$(file -b "${binary}")"
            echo "$(basename "${binary}"): ${description}"
            if [[ "${description}" != *"ELF 64-bit LSB"* ]]; then
              echo "$(basename "${binary}") is not a 64-bit Linux ELF." >&2
              exit 1
            fi
            if [[ "${description}" != *"static-pie linked"* && \
              "${description}" != *"statically linked"* ]]; then
              echo "$(basename "${binary}") is not statically linked." >&2
              exit 1
            fi

            program_headers="$(readelf -lW "${binary}")"
            if grep -q ' INTERP ' <<< "${program_headers}"; then
              echo "$(basename "${binary}") unexpectedly contains a dynamic interpreter." >&2
              exit 1
            fi

            ldd_output="$(ldd "${binary}" 2>&1 || true)"
            echo "ldd $(basename "${binary}"): ${ldd_output}"
          done

      - name: Create archive and checksum
        env:
          SOURCE_SHA: ${{ needs.metadata.outputs.source_sha }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.metadata.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          package_name="codex-sandbox-server-${VERSION}-${TARGET}"
          archive_name="${package_name}.tar.gz"
          output_dir="dist/${TARGET}"
          source_date_epoch="$(git show -s --format=%ct "${SOURCE_SHA}")"

          mkdir -p "${output_dir}"

          tar \
            --sort=name \
            --mtime="@${source_date_epoch}" \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -C "${RUNNER_TEMP}" \
            -cf - \
            "${package_name}" \
            | gzip -9n > "${output_dir}/${archive_name}"
          (
            cd "${output_dir}"
            sha256sum "${archive_name}" > "${archive_name}.sha256"
          )

      - name: Upload packaged bundle
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: sandbox-server-${{ matrix.target }}
          path: dist/${{ matrix.target }}/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs:
      - metadata
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Download packaged bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Verify checksums and create release metadata
        env:
          RELEASE_TAG: ${{ needs.metadata.outputs.release_tag }}
          SOURCE_SHA: ${{ needs.metadata.outputs.source_sha }}
          VERSION: ${{ needs.metadata.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          cd dist
          sha256sum --check ./*.tar.gz.sha256

          x86_file="codex-sandbox-server-${VERSION}-x86_64-unknown-linux-musl.tar.gz"
          arm64_file="codex-sandbox-server-${VERSION}-aarch64-unknown-linux-musl.tar.gz"
          x86_latest_file="codex-sandbox-server-x86_64-unknown-linux-musl.tar.gz"
          arm64_latest_file="codex-sandbox-server-aarch64-unknown-linux-musl.tar.gz"
          cp "${x86_file}" "${x86_latest_file}"
          cp "${arm64_file}" "${arm64_latest_file}"
          sha256sum "${x86_latest_file}" > "${x86_latest_file}.sha256"
          sha256sum "${arm64_latest_file}" > "${arm64_latest_file}.sha256"
          sha256sum ./*.tar.gz > SHA256SUMS

          x86_sha="$(sha256sum "${x86_file}" | awk '{print $1}')"
          arm64_sha="$(sha256sum "${arm64_file}" | awk '{print $1}')"

          jq -n \
            --arg version "${VERSION}" \
            --arg tag "${RELEASE_TAG}" \
            --arg commit "${SOURCE_SHA}" \
            --arg x86_file "${x86_file}" \
            --arg x86_latest_file "${x86_latest_file}" \
            --arg x86_sha "${x86_sha}" \
            --arg arm64_file "${arm64_file}" \
            --arg arm64_latest_file "${arm64_latest_file}" \
            --arg arm64_sha "${arm64_sha}" \
            '{
              version: $version,
              tag: $tag,
              commit: $commit,
              artifacts: {
                "x86_64-linux": {
                  file: $x86_file,
                  latestFile: $x86_latest_file,
                  sha256: $x86_sha
                },
                "aarch64-linux": {
                  file: $arm64_file,
                  latestFile: $arm64_latest_file,
                  sha256: $arm64_sha
                }
              }
            }' > manifest.json

      - name: Create immutable GitHub Release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          tag_name: ${{ needs.metadata.outputs.release_tag }}
          target_commitish: ${{ needs.metadata.outputs.source_sha }}
          name: codex-sandbox-server ${{ needs.metadata.outputs.version }}
          make_latest: true
          body: |
            Static Linux builds of `codex-sandbox-server` and its sibling
            `codex-linux-sandbox` helper.

            Source commit: `${{ needs.metadata.outputs.source_sha }}`

            Verify downloads with `sha256sum --check SHA256SUMS`.
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/SHA256SUMS
            dist/manifest.json
